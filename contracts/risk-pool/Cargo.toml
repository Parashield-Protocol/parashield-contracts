[package]
name        = "parashield-risk-pool"
version     = "0.2.0"
edition     = "2021"
description = "Liquidity provider risk pools with yield distribution for Parashield Protocol"
authors     = ["Parashield Protocol <contracts@parashield.xyz>"]
keywords    = ["soroban", "stellar", "liquidity", "yield", "defi"]
categories  = ["cryptography::cryptocurrencies"]
license     = "MIT"
publish     = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
testutils = ["soroban-sdk/testutils"]

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
