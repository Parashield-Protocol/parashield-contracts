[workspace]
members = [
    "oracle-verifier",
    "policy-engine",
    "claims-processor",
    "risk-pool",
    "governance-dao",
]
resolver = "2"

[workspace.dependencies]
soroban-sdk = { version = "22" }

[workspace.metadata.parashield]
protocol-version = "2"
audit-status     = "pending"
target-network   = "stellar-mainnet"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true

# dev-optimized: faster build for local iteration
[profile.dev]
opt-level = 0
debug = true
overflow-checks = true
