[package]
name        = "parashield-claims-processor"
version     = "0.2.0"
edition     = "2021"
description = "Automatic claim evaluation and settlement engine for Parashield Protocol"
authors     = ["Parashield Protocol <contracts@parashield.xyz>"]
keywords    = ["soroban", "stellar", "claims", "insurance", "defi"]
categories  = ["cryptography::cryptocurrencies"]
license     = "MIT"
publish     = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
testutils = ["soroban-sdk/testutils"]

[dependencies]
soroban-sdk               = { workspace = true }
parashield-policy-engine   = { path = "../policy-engine", default-features = false, features = ["library"] }
parashield-oracle-verifier = { path = "../oracle-verifier", default-features = false, features = ["library"] }
parashield-risk-pool       = { path = "../risk-pool" }

[dev-dependencies]
soroban-sdk               = { workspace = true, features = ["testutils"] }
parashield-policy-engine   = { path = "../policy-engine",   features = ["testutils"] }
parashield-oracle-verifier = { path = "../oracle-verifier", features = ["testutils"] }
parashield-risk-pool       = { path = "../risk-pool" }